<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420" role="img" aria-labelledby="t d">
  <title id="t">facing ratio 20% and 80%</title>
  <desc id="d">Two examples. In both, the edge of the target display is 150 long. On the left, only 30 of it touches the current display, so the facing ratio is 20%. On the right, 120 of it touches, so the facing ratio is 80%. In both, the pointer is pushed against a stretch of the current display's edge with nothing behind it.</desc>

  <style>
    .bg      { fill: #ffffff; stroke: #d0d7de; stroke-width: 1 }
    .target  { fill: #e1f5ee; stroke: #0f6e56; stroke-width: 1 }
    .current { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1 }
    .wall    { stroke: #b4b2a9; stroke-width: 5 }
    .opening { stroke: #1d9e75; stroke-width: 5 }
    .dim     { stroke: #3d3d3a; stroke-width: 1 }
    .dimopen { stroke: #1d9e75; stroke-width: 1.5 }
    .leader  { stroke: #1d9e75; stroke-width: 0.75; stroke-dasharray: 3 3 }
    .push    { stroke: #534ab7; stroke-width: 1.5; fill: none }
    .pointer { fill: #534ab7 }
    text     { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-anchor: middle }
    .label   { font-size: 12px; fill: #52514e }
    .open    { fill: #0f6e56; font-weight: 600 }
    .result  { font-size: 14px; font-weight: 600; fill: #1f2328 }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534ab7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="679" height="419" rx="10"/>

  <!-- ================= 20% ================= -->
  <rect class="target"  x="90"  y="50"  width="90"  height="150" rx="2"/>
  <rect class="current" x="180" y="170" width="120" height="150" rx="2"/>
  <text class="label" x="135" y="115">target</text>
  <text class="label" x="240" y="245">current</text>

  <!-- the target's edge: the part beside nothing, and the opening -->
  <line class="wall"    x1="180" y1="50"  x2="180" y2="170"/>
  <line class="opening" x1="180" y1="170" x2="180" y2="200"/>

  <!-- the pointer, pushed against the dead stretch -->
  <circle class="pointer" cx="198" cy="290" r="5"/>
  <line class="push" x1="192" y1="290" x2="168" y2="290" marker-end="url(#arrow)"/>

  <!-- 150: the whole edge; 30: the opening -->
  <line class="dim" x1="60" y1="50"  x2="60" y2="200"/>
  <line class="dim" x1="54" y1="50"  x2="66" y2="50"/>
  <line class="dim" x1="54" y1="200" x2="66" y2="200"/>
  <line class="dimopen" x1="76" y1="170" x2="76" y2="200"/>
  <line class="dimopen" x1="70" y1="170" x2="82" y2="170"/>
  <line class="dimopen" x1="70" y1="200" x2="82" y2="200"/>
  <line class="leader"  x1="82" y1="170" x2="180" y2="170"/>

  <text class="label"  x="180" y="352"><tspan class="open">30</tspan> ÷ 150</text>
  <text class="result" x="180" y="376">facing ratio 20%</text>
  <text class="label"  x="180" y="396">the wall feels expected</text>

  <!-- ================= 80% ================= -->
  <rect class="target"  x="410" y="50" width="90"  height="150" rx="2"/>
  <rect class="current" x="500" y="80" width="120" height="150" rx="2"/>
  <text class="label" x="455" y="140">target</text>
  <text class="label" x="560" y="160">current</text>

  <!-- the target's edge: the part beside nothing, and the opening -->
  <line class="wall"    x1="500" y1="50" x2="500" y2="80"/>
  <line class="opening" x1="500" y1="80" x2="500" y2="200"/>

  <!-- the pointer, pushed against the dead stretch -->
  <circle class="pointer" cx="518" cy="216" r="5"/>
  <line class="push" x1="512" y1="216" x2="488" y2="216" marker-end="url(#arrow)"/>

  <!-- 150: the whole edge; 120: the opening -->
  <line class="dim" x1="380" y1="50"  x2="380" y2="200"/>
  <line class="dim" x1="374" y1="50"  x2="386" y2="50"/>
  <line class="dim" x1="374" y1="200" x2="386" y2="200"/>
  <line class="dimopen" x1="396" y1="80"  x2="396" y2="200"/>
  <line class="dimopen" x1="390" y1="80"  x2="402" y2="80"/>
  <line class="dimopen" x1="390" y1="200" x2="402" y2="200"/>
  <line class="leader"  x1="402" y1="80"  x2="500" y2="80"/>

  <text class="label"  x="500" y="352"><tspan class="open">120</tspan> ÷ 150</text>
  <text class="result" x="500" y="376">facing ratio 80%</text>
  <text class="label"  x="500" y="396">the wall feels unexpected</text>
</svg>
