<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 360" width="590" height="360" role="img" aria-labelledby="t d">
  <title id="t">laptop and external monitor</title>
  <desc id="d">A laptop next to a larger external monitor. The laptop screen is smaller and sits lower, so the two screens meet only along a short part of the edge between them. That part is marked in green.</desc>

  <style>
    .bg     { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
    .body   { fill: #ffffff; stroke: #333333; stroke-width: 4; stroke-linejoin: round; }
    .screen { fill: #e8eef5; }
    .facing { fill: rgba(29, 158, 117, 0.15); stroke: #1d9e75; stroke-width: 3; }
  </style>

  <rect class="bg" x="0.5" y="0.5" width="589" height="359" rx="10"/>

  <!-- External monitor -->
  <path class="body" d="M395 240 V328 H425 V240 Z"/>
  <rect class="body" x="345" y="328" width="130" height="12" rx="6"/>
  <rect class="body" x="250" y="30" width="320" height="210" rx="8"/>
  <rect class="screen" x="262" y="42" width="296" height="186" rx="3"/>

  <!-- Laptop -->
  <rect class="body" x="40" y="170" width="210" height="150" rx="7"/>
  <rect class="screen" x="50" y="180" width="190" height="130" rx="3"/>
  <path class="body" d="M34 320 H256 L272 334 Q276 340 268 340 H22 Q14 340 18 334 Z"/>

  <!-- Part of the edge where the two screens touch -->
  <rect class="facing" x="240" y="174" width="22" height="62" rx="4"/>
</svg>
